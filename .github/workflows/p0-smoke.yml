name: P0 Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: p0-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-smoke:
    name: Local P0 Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      EXPO_NO_TELEMETRY: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run P0 smoke suite
        run: npm run smoke:p0
